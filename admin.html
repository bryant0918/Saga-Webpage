<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Saga - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="custom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
    <meta name="description" content="Family Saga admin page - view and manage stored tree data.">
    <link rel="icon" type="image/png" href="assets/saga.png">
    <style>
        .user-profile-badge {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 14px;
            border-radius: 24px;
            background-color: var(--light-black);
            border: 1px solid var(--light-black);
        }
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: var(--gold-primary);
            color: var(--deep-black);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: var(--primary-black);">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="index.html" style="color: var(--gold-primary);">
                <img src="assets/saga.png" alt="Family Saga" style="height: 40px; width: auto; margin-right: 10px; border-radius: 50%;">
                Family Saga
            </a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <div class="user-profile-badge">
                    <div class="user-avatar" id="userAvatar">
                        <i class="fas fa-user" style="font-size: 0.75rem;"></i>
                    </div>
                    <div>
                        <div id="userDisplayName" style="color: var(--text-gray); font-size: 0.85rem; font-weight: 500; line-height: 1.2;">Loading...</div>
                        <div id="userDisplayId" style="color: var(--text-dark-gray); font-size: 0.75rem; line-height: 1.2;"></div>
                    </div>
                </div>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="fas fa-sign-out-alt me-1"></i>Sign Out
                </button>
            </div>
        </div>
    </nav>

    <input type="file" id="imageUploadInput" accept="image/jpeg,image/png,image/webp" style="display: none;" onchange="handleImageFileSelected(this)">

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 style="color: var(--gold-primary); margin: 0;"><i class="fas fa-user-shield me-2"></i>Admin Dashboard</h4>
            <button class="btn btn-outline-warning btn-sm" onclick="openBuildChartModal()"><i class="fas fa-hammer me-1"></i>Build Chart</button>
        </div>

        <div>
            <div class="tab-pane fade show active" id="viewDataPane" role="tabpanel" aria-labelledby="view-data-tab">
                <div class="row justify-content-center">
                    <div class="col-lg-10">
                        <div class="card mb-4">
                            <div class="card-body p-4">
                                <h4 class="mb-3" style="color: var(--gold-primary);">Search Trees</h4>
                                <p style="color: var(--text-dark-gray); font-size: 0.9rem;">Search by name or FamilySearch ID to find stored tree data.</p>
                                <div class="row g-3 align-items-end">
                                    <div class="col-md-8">
                                        <input type="text" class="form-control" id="treeSearchInput" placeholder="e.g. mcarthur, bryant, KWN5-J7M...">
                                    </div>
                                    <div class="col-md-4">
                                        <button id="searchBtn" class="btn btn-nordic w-100">
                                            <i class="fas fa-search me-2"></i>Search
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div id="searchResults">
                            <div class="text-center py-5">
                                <i class="fas fa-folder-open fa-3x mb-3" style="color: var(--light-black);"></i>
                                <p style="color: var(--text-dark-gray);">Search above to browse stored tree data.</p>
                            </div>
                        </div>

                        <div id="selectedTreePanel" style="display: none;" class="mt-4">
                            <div class="card mb-3">
                                <div class="card-body py-2 px-3">
                                    <div class="d-flex align-items-center justify-content-between">
                                        <div class="d-flex align-items-center">
                                            <i class="fas fa-folder-tree me-2" style="color: var(--gold-primary);"></i>
                                            <span id="selectedTreeLabel" style="color: var(--text-gray); font-weight: 500;"></span>
                                        </div>
                                        <button class="btn btn-sm btn-outline-warning" onclick="openBuildChartModal()"><i class="fas fa-hammer me-1"></i>Build Chart</button>
                                    </div>
                                </div>
                            </div>

                            <div class="card mb-3">
                                <div class="card-body py-2 px-3">
                                    <h6 class="mb-2" style="color: var(--gold-primary);"><i class="fas fa-file-pdf me-2"></i>Chart Builds</h6>
                                    <div id="chartBuildsList" class="small" style="color: var(--text-dark-gray);">Select a tree context to see builds.</div>
                                </div>
                            </div>

                            <div id="dataListContainer"></div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Build Chart Modal -->
    <div class="modal fade" id="buildChartModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content" style="background-color: var(--primary-black); border: 1px solid var(--light-black);">
                <div class="modal-header" style="border-bottom: 1px solid var(--light-black);">
                    <h5 class="modal-title" style="color: var(--gold-primary);"><i class="fas fa-hammer me-2"></i>Build Chart</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Context</label>
                        <div id="buildChartContextLabel" style="color: var(--text-gray);"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Tree Type</label>
                        <select id="buildChartType" class="form-select">
                            <option value="ancestor" selected>Ancestor</option>
                            <option value="descendant">Descendant</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Theme</label>
                        <select id="buildChartTheme" class="form-select">
                            <option value="black">Royal Heritage (Black & Gold)</option>
                            <option value="rustic">Rustic Roots</option>
                            <option value="green">Vintage Botanical</option>
                            <option value="stone">Ancestral Stone</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Generations</label>
                        <select id="buildChartGenerations" class="form-select">
                            <option value="5">5</option>
                            <option value="4">4</option>
                        </select>
                    </div>
                    <div id="buildChartStatus" class="small mt-2"></div>
                </div>
                <div class="modal-footer" style="border-top: 1px solid var(--light-black);">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" id="submitBuildChartBtn" class="btn btn-nordic" onclick="submitBuildChart()"><i class="fas fa-play me-1"></i>Build</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="py-4 text-center mt-5" style="background-color: var(--deep-black); color: var(--text-gray);">
        <div class="container">
            <div class="d-flex align-items-center justify-content-center mb-2">
                <img src="assets/saga.png" alt="Family Saga" style="height: 25px; width: auto; margin-right: 8px; border-radius: 50%;">
                <span style="color: var(--gold-primary); font-weight: 600;">Family Saga</span>
            </div>
            <p class="mb-0" style="font-size: 0.9rem;">Crafting luxury family stories with sophisticated elegance.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="/api/public-config.js"></script>
    <script src="image-cropper.js"></script>
    <script src="admin.js"></script>
</body>
</html>
